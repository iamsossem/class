<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>모퉁이책방 - 골목 작은 서점</title>
</head>
<body>
  <!-- 머리말 -->
  <header>
    <h1>모퉁이책방</h1>
    <nav>
      <a href="#">소개</a>
      <a href="#">이달의 책</a>
      <a href="#">오시는 길</a>
    </nav>
  </header>

  <main>
    <!-- 서점 소개 -->
    <section>
      <h2>서점 소개</h2>
      <p>골목 모퉁이에서 손님과 책을 천천히 이어 주는 작은 서점입니다.</p>
      <p>매주 토요일 오후에는 <strong>작은 북토크</strong>가 열립니다.</p>
    </section>

    <!-- 이달의 책 ① -->
    <article>
      <h2>이달의 책 ①</h2>
      <p>&lt;골목의 계절&gt; - 동네 골목을 사계절 동안 걸으며 쓴 산문집이다.</p>
    </article>

    <!-- 이달의 책 ② -->
    <article>
      <h2>이달의 책 ②</h2>
      <p>&lt;느린 편지&gt; - 천천히 읽을수록 따뜻해지는 짧은 편지 모음이다.</p>
    </article>

    <!-- 영업 안내 -->
    <aside>
      <h2>영업 안내</h2>
      <p>평일 <span>10:00~20:00</span></p>
      <p>일요일은 쉽니다.</p>
    </aside>
  </main>

  <!-- 꼬리말 -->
  <footer>
    <p>© 2026 모퉁이책방 | 서울시 모퉁이구 책길 1</p>
  </footer>
  <!-- 확인 메모: 가로 전체를 차지하는 요소 = p(블록), 글자 폭만큼만 차지하는 요소 = span(인라인) -->
</body>
</html>
