<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>그린포트 - 반려식물 가게 - 구조 보기</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; color: #233328; line-height: 1.6; background: #f7faf5; font-family: sans-serif; }
main { flex: 1; }
img { display: block; max-width: 100%; }
.nav { display: flex; justify-content: space-between; align-items: center; padding: 14px 40px; background: #fff; border-bottom: 1px solid #dfe8dc; }
.logo { font-size: 22px; font-weight: bold; color: #2f8f5b; text-decoration: none; }
.menu { display: flex; gap: 28px; margin: 0; padding: 0; list-style: none; }
.menu a { color: #233328; text-decoration: none; }
.cart-btn { padding: 8px 18px; background: #2f8f5b; color: #fff; border-radius: 20px; text-decoration: none; }
.hero { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 360px; padding: 40px 20px; background: linear-gradient(rgba(20,40,28,.45), rgba(20,40,28,.45)), url("images/green-hero.jpg") center / cover; color: #fff; text-align: center; }
.hero h1 { margin: 0 0 8px; font-size: 40px; }
.hero p { margin: 0 0 20px; }
.hero .btn { padding: 12px 28px; background: #fff; color: #2f8f5b; border-radius: 24px; font-weight: bold; text-decoration: none; }
.section { max-width: 1000px; margin: 0 auto; padding: 48px 20px 8px; }
.section h2 { margin: 0 0 20px; text-align: center; }
.cards { display: flex; gap: 20px; }
.card { flex: 1; background: #fff; border: 1px solid #dfe8dc; border-radius: 12px; overflow: hidden; }
.card img { width: 100%; height: 200px; object-fit: cover; }
.card-body { padding: 16px; }
.card h3 { margin: 0 0 4px; }
.card p { margin: 0 0 8px; color: #5b6b60; font-size: 14px; }
.price { font-weight: bold; color: #2f8f5b; }
.features { display: flex; justify-content: space-around; max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
.feature { display: flex; flex-direction: column; align-items: center; text-align: center; }
.feature .icon { font-size: 36px; }
.feature strong { margin: 4px 0; }
.feature span { font-size: 14px; color: #5b6b60; }
.footer { display: flex; justify-content: space-between; align-items: center; padding: 24px 40px; background: #233328; color: #fff; font-size: 14px; }
.footer a { margin-left: 16px; color: #cfe3d3; text-decoration: none; }

/* ---- 완성도 높이기: 호버 · 포커스 · 가상 요소 ---- */
html { scroll-behavior: smooth; }
::selection { background: #cfe8d6; }
a:focus-visible { outline: 3px solid #f4b942; outline-offset: 3px; }
a { transition: color .2s, background-color .2s, transform .2s, box-shadow .2s; }
.logo:hover { color: #236f46; }
.menu a { position: relative; padding: 4px 0; }
.menu a::after { content: ""; position: absolute; left: 0; bottom: 0; width: 100%; height: 2px; background: #2f8f5b; transform: scaleX(0); transform-origin: left; transition: transform .25s; }
.menu a:hover { color: #2f8f5b; }
.menu a:hover::after { transform: scaleX(1); }
.cart-btn:hover { background: #236f46; }
.cart-btn:active { transform: scale(.96); }
.hero h1::after { content: ""; display: block; width: 56px; height: 4px; margin: 12px auto 0; background: #f4b942; border-radius: 2px; }
.hero .btn:hover { background: #2f8f5b; color: #fff; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.25); }
.hero .btn:active { transform: translateY(0); box-shadow: none; }
.section h2::after { content: ""; display: block; width: 40px; height: 4px; margin: 10px auto 0; background: #2f8f5b; border-radius: 2px; }
.card { position: relative; transition: transform .25s, box-shadow .25s; }
.card:hover { transform: translateY(-6px); box-shadow: 0 12px 24px rgba(35,51,40,.12); }
.card img { transition: transform .4s; }
.card:hover img { transform: scale(1.06); }
.card h3 { transition: color .2s; }
.card:hover h3 { color: #2f8f5b; }
.card:first-child::before { content: "BEST"; position: absolute; top: 12px; left: 12px; z-index: 1; padding: 2px 10px; background: #f4b942; color: #233328; border-radius: 12px; font-size: 12px; font-weight: bold; }
.feature .icon { display: inline-block; transition: transform .25s; }
.feature:hover .icon { transform: translateY(-4px) scale(1.15); }
.footer a:hover { color: #fff; text-decoration: underline; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  a, .menu a::after, .card, .card img, .feature .icon { transition: none; }
}
.nav{outline:2px dashed #ff8a00;outline-offset:-2px;position:relative}
.nav::before{content:"display:flex; justify-content:space-between; align-items:center";position:absolute;left:2px;top:2px;z-index:50;padding:0 5px;background:#fff3e0;color:#c25e00;font:bold 11px monospace;white-space:nowrap;}
.menu{outline:2px dashed #ff8a00;outline-offset:-2px;position:relative}
.menu::before{content:"display:flex; gap:28px";position:absolute;left:2px;top:2px;z-index:50;padding:0 5px;background:#fff3e0;color:#c25e00;font:bold 11px monospace;white-space:nowrap;top:-6px}
.hero{outline:2px dashed #ff8a00;outline-offset:-2px;position:relative}
.hero::before{content:"flex-direction:column; justify-content:center; align-items:center";position:absolute;left:2px;top:2px;z-index:50;padding:0 5px;background:#fff3e0;color:#c25e00;font:bold 11px monospace;white-space:nowrap;}
.cards{outline:2px dashed #ff8a00;outline-offset:-2px;position:relative}
.cards::before{content:"display:flex; gap:20px";position:absolute;left:2px;top:2px;z-index:50;padding:0 5px;background:#fff3e0;color:#c25e00;font:bold 11px monospace;white-space:nowrap;}
.card{outline:2px dashed #ff8a00;outline-offset:-2px;position:relative}
.card::before{content:"flex:1";position:absolute;left:2px;top:2px;z-index:50;padding:0 5px;background:#fff3e0;color:#c25e00;font:bold 11px monospace;white-space:nowrap;top:auto;bottom:2px}
.features{outline:2px dashed #ff8a00;outline-offset:-2px;position:relative}
.features::before{content:"display:flex; justify-content:space-around";position:absolute;left:2px;top:2px;z-index:50;padding:0 5px;background:#fff3e0;color:#c25e00;font:bold 11px monospace;white-space:nowrap;}
.feature{outline:2px dashed #ff8a00;outline-offset:-2px;position:relative}
.feature::before{content:"flex-direction:column; align-items:center";position:absolute;left:2px;top:2px;z-index:50;padding:0 5px;background:#fff3e0;color:#c25e00;font:bold 11px monospace;white-space:nowrap;top:auto;bottom:0}
.footer{outline:2px dashed #ff8a00;outline-offset:-2px;position:relative}
.footer::before{content:"display:flex; justify-content:space-between; align-items:center";position:absolute;left:2px;top:2px;z-index:50;padding:0 5px;background:#fff3e0;color:#c25e00;font:bold 11px monospace;white-space:nowrap;}
main{outline:2px dashed #ff8a00;outline-offset:-2px;position:relative}
main::before{content:"main { flex:1 } ← 남는 높이를 채움";position:absolute;left:2px;top:2px;z-index:50;padding:0 5px;background:#fff3e0;color:#c25e00;font:bold 11px monospace;white-space:nowrap;top:auto;bottom:2px;left:auto;right:2px}
.card img{outline:2px dashed #3b82f6;outline-offset:-2px}
</style>
</head>
<body>
<header class="nav">
  <a class="logo" href="#">🌿 그린포트</a>
  <ul class="menu">
    <li><a href="#plants">식물</a></li>
    <li><a href="#care">케어 팁</a></li>
    <li><a href="#contact">문의</a></li>
  </ul>
  <a class="cart-btn" href="#">장바구니 0</a>
</header>
<main>
  <section class="hero">
    <h1>방 안에 작은 숲을</h1>
    <p>처음 키우는 사람도 쉬운 반려식물, 그린포트</p>
    <a class="btn" href="#plants">식물 보러 가기</a>
  </section>

  <section class="section" id="plants">
    <h2>이번 주 인기 식물</h2>
    <div class="cards">
      <article class="card">
        <img src="images/green-monstera.jpg" alt="몬스테라 화분">
        <div class="card-body">
          <h3>몬스테라</h3>
          <p>넓은 잎이 매력적인 대표 인테리어 식물</p>
          <span class="price">24,000원</span>
        </div>
      </article>
      <article class="card">
        <img src="images/green-cactus.jpg" alt="선인장 화분">
        <div class="card-body">
          <h3>꽃 선인장</h3>
          <p>물을 자주 안 줘도 잘 자라는 초보용 식물</p>
          <span class="price">12,000원</span>
        </div>
      </article>
      <article class="card">
        <img src="images/green-pothos.jpg" alt="포토스 화분">
        <div class="card-body">
          <h3>포토스</h3>
          <p>덩굴이 늘어지는 모습이 예쁜 공기정화 식물</p>
          <span class="price">15,000원</span>
        </div>
      </article>
    </div>
  </section>

  <section class="features" id="care">
    <div class="feature"><span class="icon">💧</span><strong>물주기 알림</strong><span>카카오톡으로 알려 드려요</span></div>
    <div class="feature"><span class="icon">🚚</span><strong>무료 배송</strong><span>3만 원 이상 구매 시</span></div>
    <div class="feature"><span class="icon">🌱</span><strong>30일 보증</strong><span>시들면 새 식물로 교환</span></div>
  </section>
</main>
<footer class="footer" id="contact">
  <span>© 2026 그린포트</span>
  <div><a href="#">인스타그램</a><a href="#">블로그</a></div>
</footer>
</body>
</html>
