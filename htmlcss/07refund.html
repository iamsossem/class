<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>취소·환불 안내 - 바람길</title>
</head>

<body>
  <header>
    <h1>취소·환불 안내</h1>
  </header>

  <main>
    <p>제주 2박 3일 걷기 여행의 취소와 환불 규정입니다.</p>

    <section>
      <h2>환불 규정</h2>
      <!-- 기간과 비율처럼 칸마다 짝이 있는 데이터이므로 목록보다 표가 알맞다 -->
      <table>
        <caption>출발일 기준 환불 비율</caption>
        <thead>
          <tr>
            <th scope="col">취소 시점</th>
            <th scope="col">환불 비율</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">출발 7일 전까지</th>
            <td>100% 환불</td>
          </tr>
          <tr>
            <th scope="row">출발 3일 전까지</th>
            <td>50% 환불</td>
          </tr>
          <tr>
            <th scope="row">그 이후</th>
            <td>환불 불가</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <footer>
    <!-- refund.html은 pages 폴더 안에 있으므로 한 단계 위(..)로 올라가 index.html을 찾는다 -->
    <p><a href="./07final.html">제주 2박 3일 상품 안내로 돌아가기</a></p>
  </footer>
</body>

</html>
