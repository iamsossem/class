<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>여행 앨범 - 제주 3박 4일</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <a href="#" class="icon-btn" aria-label="메뉴"><i class="fa-solid fa-bars icon"></i></a>
    <a href="#" class="logo"><i class="fa-solid fa-images icon"></i>앨범</a>
    <label class="search">
      <i class="fa-solid fa-magnifying-glass icon"></i>
      <input type="search" placeholder="사진, 장소, 사람 검색">
    </label>
    <a href="#" class="profile" aria-label="내 프로필">S</a>
  </header>

  <main class="page">
    <section class="head">
      <img class="cover" src="images/jeju-sunrise.jpg" alt="성산 일출봉의 일출">
      <div class="title">
        <p class="eyebrow">여행 앨범</p>
        <h1>제주 3박 4일</h1>
        <p class="period"><i class="fa-solid fa-calendar-days icon"></i>2026년 10월 12일 ~ 15일</p>
      </div>
      <div class="stats">
        <div class="stat"><i class="fa-solid fa-images icon"></i><div><strong>9장</strong><span>사진</span></div></div>
        <div class="stat"><i class="fa-solid fa-location-dot icon"></i><div><strong>9곳</strong><span>장소</span></div></div>
        <div class="stat"><i class="fa-solid fa-user-group icon"></i><div><strong>3명</strong><span>함께한 사람</span></div></div>
      </div>
      <div class="actions">
        <a href="#" class="btn filled"><i class="fa-solid fa-share-nodes"></i>공유</a>
        <a href="#" class="btn outlined"><i class="fa-solid fa-circle-play"></i>슬라이드쇼</a>
      </div>
    </section>

    <div class="chips">
      <a href="#" class="chip selected"><i class="fa-solid fa-check"></i>전체</a>
      <a href="#" class="chip">1일차</a>
      <a href="#" class="chip">2일차</a>
      <a href="#" class="chip">3일차</a>
    </div>

    <section class="day">
      <h2>10월 12일 (토)<span>도착 · 해안 드라이브</span></h2>
      <div class="mosaic">
        <a href="#" class="photo"><figure><img src="images/jeju-cafe.jpg" alt="애월 카페"><figcaption>애월 카페</figcaption></figure></a>
        <a href="#" class="photo big"><figure><img src="images/jeju-beach.jpg" alt="협재 해변"><figcaption>협재 해변</figcaption></figure></a>
        <a href="#" class="photo tall"><figure><img src="images/jeju-wall.jpg" alt="돌담길"><figcaption>돌담길</figcaption></figure></a>
        <a href="#" class="photo"><figure><img src="images/jeju-orchard.jpg" alt="감귤 농장"><figcaption>감귤 농장</figcaption></figure></a>
      </div>
    </section>

    <section class="day">
      <h2>10월 13일 (일)<span>동쪽 일출과 한라산</span></h2>
      <div class="mosaic">
        <a href="#" class="photo big"><figure><img src="images/jeju-sunrise.jpg" alt="성산 일출봉"><figcaption>성산 일출봉</figcaption></figure></a>
        <a href="#" class="photo tall"><figure><img src="images/jeju-halla.jpg" alt="한라산"><figcaption>한라산</figcaption></figure></a>
        <a href="#" class="photo tall"><figure><img src="images/jeju-canola.jpg" alt="유채꽃 밭"><figcaption>유채꽃 밭</figcaption></figure></a>
      </div>
    </section>

    <section class="day">
      <h2>10월 14일 (월)<span>오름과 시내</span></h2>
      <div class="mosaic">
        <a href="#" class="photo wide"><figure><img src="images/jeju-oreum.jpg" alt="새별오름"><figcaption>새별오름</figcaption></figure></a>
        <a href="#" class="photo wide"><figure><img src="images/jeju-night.jpg" alt="제주시 야경"><figcaption>제주시 야경</figcaption></figure></a>
      </div>
    </section>

    <section class="others">
      <h2>다른 앨범</h2>
      <div class="album-list">
      <a href="#" class="album-card"><img src="images/jeju-halla.jpg" alt="한라산 겨울 산행"><div><h3>한라산 겨울 산행</h3><p>사진 14장</p></div></a>
      <a href="#" class="album-card"><img src="images/jeju-beach.jpg" alt="여름 바다 휴가"><div><h3>여름 바다 휴가</h3><p>사진 32장</p></div></a>
      <a href="#" class="album-card"><img src="images/jeju-night.jpg" alt="서울 야경 투어"><div><h3>서울 야경 투어</h3><p>사진 21장</p></div></a>
      <a href="#" class="album-card"><img src="images/jeju-wall.jpg" alt="골목 산책"><div><h3>골목 산책</h3><p>사진 9장</p></div></a>
      </div>
    </section>
  </main>

  <a href="#" class="fab" aria-label="사진 추가"><i class="fa-solid fa-plus"></i></a>
</body>
</html>
