<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모닝브루 - 동네 카페</title>
  <link rel="stylesheet" href="12final.css">
</head>
<body>
  <header id="top">
    <h1>모닝브루</h1>
    <p class="slogan">아침을 여는 한 잔</p>
  </header>

  <main>
    <section class="menu">
      <h2>오늘의 메뉴</h2>
      <article class="card">
        <h3>아메리카노</h3>
        <p class="desc">고소한 원두의 깔끔한 맛</p>
        <p class="price">4,000원</p>
      </article>
      <article class="card best">
        <h3>바닐라 라떼</h3>
        <p class="desc">부드러운 우유와 바닐라 시럽</p>
        <p class="price">5,500원</p>
      </article>
      <article class="card">
        <h3>딸기 케이크</h3>
        <p class="desc">매일 아침 굽는 생크림 케이크</p>
        <p class="price">6,500원</p>
      </article>
    </section>

    <section class="info">
      <h2>이용 안내</h2>
      <ul>
        <li>영업시간: 오전 8시 ~ 오후 8시</li>
        <li>휴무일: 매주 월요일</li>
        <li>주차: 가게 앞 2대</li>
        <li>문의: <a href="#">카카오톡 채널</a></li>
      </ul>
    </section>
  </main>

  <footer>
    <p>© 2026 모닝브루</p>
  </footer>
</body>
</html>
